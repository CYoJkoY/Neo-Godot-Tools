name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  stable-release:
    name: Stable release
    if: ${{ !contains(github.ref_name, '.dev') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript-only source tree
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Validate stable release tag
        id: release
        run: |
          npx ts-node tools/release.ts "$GITHUB_REF_NAME"
          if grep -q '^development=true$' "$GITHUB_OUTPUT"; then
            echo "A development tag cannot use the stable release channel."
            exit 1
          fi

      - name: Package stable VSIX
        run: npx @vscode/vsce@latest package --out "${{ steps.release.outputs.asset }}"

      - name: Validate VSIX
        run: |
          test -s "${{ steps.release.outputs.asset }}"
          npx @vscode/vsce@latest ls --tree "${{ steps.release.outputs.asset }}"

      - name: Upload stable VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-godot-tools-stable-${{ github.ref_name }}
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${ASSET}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  development-release:
    name: Development pre-release
    if: ${{ contains(github.ref_name, '.dev') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript-only source tree
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Validate development release tag
        id: release
        run: |
          npx ts-node tools/release.ts "$GITHUB_REF_NAME"
          if grep -q '^development=false$' "$GITHUB_OUTPUT"; then
            echo "A stable tag cannot use the development release channel."
            exit 1
          fi

      - name: Package development VSIX
        run: npx @vscode/vsce@latest package --pre-release --out "${{ steps.release.outputs.asset }}"

      - name: Validate VSIX
        run: |
          test -s "${{ steps.release.outputs.asset }}"
          npx @vscode/vsce@latest ls --tree "${{ steps.release.outputs.asset }}"

      - name: Upload development VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-godot-tools-development-${{ github.ref_name }}
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${ASSET}" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes
