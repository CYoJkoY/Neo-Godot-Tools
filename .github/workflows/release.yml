name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript-only source tree
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Validate release version
        id: release
        run: npx ts-node tools/release.ts "$GITHUB_REF_NAME"

      - name: Package stable release
        if: steps.release.outputs.development == 'false'
        run: npm run package -- --out "${{ steps.release.outputs.asset }}"

      - name: Package development release
        if: steps.release.outputs.development == 'true'
        run: npm run package -- --pre-release --out "${{ steps.release.outputs.asset }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release.outputs.development }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" "${{ steps.release.outputs.asset }}" \
              --title "$GITHUB_REF_NAME" \
              --prerelease \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.release.outputs.asset }}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
