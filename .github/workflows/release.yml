name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and package release
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.release.outputs.asset }}
      development: ${{ steps.release.outputs.development }}
      version: ${{ steps.release.outputs.version }}
      base_version: ${{ steps.release.outputs.base_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript-only source tree
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Validate release version
        id: release
        run: npx ts-node tools/release.ts "$GITHUB_REF_NAME"

      - name: Set development VSIX version
        if: steps.release.outputs.development == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Verify packaged extension version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          ACTUAL_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "package.json version ($ACTUAL_VERSION) does not match release version ($EXPECTED_VERSION)."
            exit 1
          fi

      - name: Package stable release
        if: steps.release.outputs.development == 'false'
        run: npx @vscode/vsce@latest package --out "${{ steps.release.outputs.asset }}"

      - name: Package development release
        if: steps.release.outputs.development == 'true'
        run: npx @vscode/vsce@latest package --pre-release --out "${{ steps.release.outputs.asset }}"

      - name: Validate VSIX
        run: |
          test -s "${{ steps.release.outputs.asset }}"
          npx @vscode/vsce@latest ls --tree "${{ steps.release.outputs.asset }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-godot-tools-${{ steps.release.outputs.version }}-${{ github.ref_name }}
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Create GitHub Release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@v5
        with:
          name: neo-godot-tools-${{ needs.prepare.outputs.version }}-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: |
          if [ "${{ needs.prepare.outputs.development }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" "release/$ASSET" \
              --title "$GITHUB_REF_NAME" \
              --prerelease \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" "release/$ASSET" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  marketplace:
    name: Publish stable release to Visual Studio Marketplace
    needs: prepare
    if: needs.prepare.outputs.development == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v5
        with:
          name: neo-godot-tools-${{ needs.prepare.outputs.version }}-${{ github.ref_name }}
          path: release

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish to Visual Studio Marketplace
        env:
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: npx @vscode/vsce@latest publish --oidc --packagePath "release/$ASSET"
