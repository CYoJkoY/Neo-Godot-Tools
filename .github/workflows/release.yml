name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Stable release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript-only source tree
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Validate release tag
        id: release
        run: npx ts-node tools/release.ts "$GITHUB_REF_NAME"

      - name: Generate changelog and release notes from live tags
        run: |
          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")" ]; then
            echo "The release tag moved after checkout; refusing to publish a mismatched VSIX."
            exit 1
          fi
          npm run changelog -- --ref "$GITHUB_REF_NAME" --tag "$GITHUB_REF_NAME" --notes-file out/release-notes.md

      - name: Package VSIX
        run: npx @vscode/vsce@latest package --out "${{ steps.release.outputs.asset }}"

      - name: Validate VSIX
        run: |
          test -s "${{ steps.release.outputs.asset }}"
          unzip -t "${{ steps.release.outputs.asset }}"
          npx @vscode/vsce@latest ls --tree

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: neo-godot-tools-${{ github.ref_name }}
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")" ]; then
            echo "The release tag was deleted or moved while packaging; refusing to publish."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSET}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease=false --notes-file out/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${ASSET}" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file out/release-notes.md
          fi