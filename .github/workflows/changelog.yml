name: Sync changelog from release tags

on:
  push:
    tags:
      - "v*"
  delete:
  workflow_dispatch:
  schedule:
    - cron: "21 3 * * *"

permissions:
  contents: write

concurrency:
  group: changelog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'delete' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Synchronize live tags
        run: git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test tag range generation
        run: npm run test:release

      - name: Rebuild changelog
        run: npm run changelog

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "Changelog is already up to date."
          else
            git commit -m "docs(changelog): update changelog [skip ci]"
            git push origin ${{ github.event.repository.default_branch }}
          fi