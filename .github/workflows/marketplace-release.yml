name: Marketplace Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish stable release to Visual Studio Marketplace
    if: ${{ !contains(github.ref_name, '.dev') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript-only source tree
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Validate release version
        run: npx ts-node tools/release.ts "$GITHUB_REF_NAME"

      - name: Package Marketplace VSIX
        run: npx @vscode/vsce@latest package --out "neo-godot-tools-${GITHUB_REF_NAME}.vsix"

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce@latest publish --oidc --packagePath "neo-godot-tools-${GITHUB_REF_NAME}.vsix"
