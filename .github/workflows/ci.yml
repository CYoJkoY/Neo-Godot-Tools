name: Continuous integration

on: [push, pull_request]

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Reject tracked JavaScript source
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint and build extension
        run: |
          npm run lint
          npm run compile
          npx @vscode/vsce@latest package --out neo-godot-tools.vsix
          test -s neo-godot-tools.vsix

      - name: Upload extension VSIX
        uses: actions/upload-artifact@v4.6.2
        with:
          name: neo-godot-tools
          path: neo-godot-tools.vsix
          if-no-files-found: error
