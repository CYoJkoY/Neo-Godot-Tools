name: Continuous integration

on: [push, pull_request]

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot_version: "4.5.1"
          - os: ubuntu-latest
            godot_version: "4.7"
          - os: windows-latest
            godot_version: "4.5.1"
          - os: windows-latest
            godot_version: "4.7"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install fgvm (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors -o fgvm-linux-x64.tar.gz https://github.com/patricktcoakley/fgvm/releases/latest/download/fgvm-linux-x64.tar.gz
          tar -xzf fgvm-linux-x64.tar.gz
          chmod +x fgvm
          sudo mv fgvm /usr/local/bin/fgvm

      - name: Install fgvm (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 5 --retry-delay 3 --retry-all-errors --output fgvm.zip https://github.com/patricktcoakley/fgvm/releases/latest/download/fgvm-win-x64.zip
          Expand-Archive -Path "fgvm.zip" -DestinationPath "C:\fgvm"
          "C:\fgvm" | Out-File -Encoding ascii -FilePath $env:GITHUB_PATH -Append

      - name: Cache Godot installations
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fgvm/installations
          key: fgvm-${{ matrix.os }}-${{ matrix.godot_version }}

      - name: Install Godot ${{ matrix.godot_version }}
        run: fgvm install ${{ matrix.godot_version }}
        env:
          FGVM_HOME: ${{ runner.temp }}/fgvm

      - name: Install dependencies
        run: npm ci

      - name: Run tests against Godot ${{ matrix.godot_version }}
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run --auto-servernum npm run test:engine -- ${{ matrix.godot_version }}
          else
            npm run test:engine -- ${{ matrix.godot_version }}
          fi
        env:
          NEO_GODOT_TOOLS_DEBUG: "false"
          FGVM_HOME: ${{ runner.temp }}/fgvm

  godot3-smoke:
    name: Godot 3.6.2 smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install fgvm
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors -o fgvm-linux-x64.tar.gz https://github.com/patricktcoakley/fgvm/releases/latest/download/fgvm-linux-x64.tar.gz
          tar -xzf fgvm-linux-x64.tar.gz
          chmod +x fgvm
          sudo mv fgvm /usr/local/bin/fgvm

      - name: Cache Godot 3.6.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fgvm/installations
          key: fgvm-ubuntu-godot-3.6.2

      - name: Install Godot 3.6.2
        run: fgvm install 3.6.2
        env:
          FGVM_HOME: ${{ runner.temp }}/fgvm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Smoke-test Godot 3.6.2 project
        working-directory: test_projects/test-smoke-project-godot3
        run: xvfb-run --auto-servernum fgvm godot --query "3.6.2" --args "--headless --editor --quit"
        env:
          FGVM_HOME: ${{ runner.temp }}/fgvm

  build:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject tracked JavaScript source
        shell: bash
        run: |
          if git ls-files -- '*.js' | grep -q .; then
            echo "Tracked JavaScript source files are not allowed."
            git ls-files -- '*.js'
            exit 1
          fi

      - name: Lint and build extension
        run: |
          npm run lint
          npm run compile
          npx @vscode/vsce@latest package --out neo-godot-tools.vsix
          test -s neo-godot-tools.vsix

      - name: Upload extension VSIX
        uses: actions/upload-artifact@v4.6.2
        with:
          name: neo-godot-tools
          path: neo-godot-tools.vsix
          if-no-files-found: error
